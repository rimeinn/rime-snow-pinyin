# Rime schema
# encoding: utf-8

__include: snow_pinyin.schema.yaml:/

schema:
  schema_id: snow_jiandao_jianpin
  name: 冰雪键道简拼
  version: "0.3.11"
  author:
    - 吅吅大山
    - 谭淞宸 <i@tansongchen.com>
  description: |
    用于辅助键道实现，非常规方案
  dependencies:
    - snow_pinyin

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - history_translator
  filters:
    - uniquifier
    - simplifier

speller:
  alphabet: bpmfdtnlgkhjqxzcsrwye
  delimiter: " '"
  algebra:
    __include: snow_sanpin.schema.yaml:/sanpin_algebra
    __append:
      # 英数字母的伪音节（`~x` / `~~x`）也要缩得出声母，否则英数混输造出来的词
      # 在声母编码下查不到。本棱镜被键道和三拼共用：键道的字母音节码是 `<声>e`
      # / `x<韵>`，三拼是在其后补一个轻声 a（`<声>ea` / `x<韵>a`），声母相同，
      # 所以这里只写键道那一套就够了。改动任一方案的字母规则时这里要跟着改
      - xform/~{1,2}([bpmfdtnlgkhjqxzcsrywe])/$1e/
      - xform/~{1,2}v/xh/
      - xform/~{1,2}i/xk/
      - xform/~{1,2}u/xj/
      - xform/~{1,2}o/xl/
      - xform/~{1,2}a/xs/
      - derive/.([viuoa])$/?$1/ # 无韵母
      - xform/^([a-z])[^?]+$/$1/ # 简拼
      - derive/^.+$/~/ # 通配符

__patch:
  - patch
  - snow_sipin.custom:/patch?

patch:
  translator/prism: snow_jiandao_jianpin
