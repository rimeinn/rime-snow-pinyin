on:
  push:
    tags:
      - "*"

name: 发布

jobs:
  build:
    name: 发布
    runs-on: ubuntu-26.04
    steps:
      - name: 获取代码
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: 安装 Rime 输入法用于编译
        run: sudo apt install -y --no-install-recommends librime-bin rime-prelude
      - name: 打包用户安装包
        run: |
          cp rime-stroke/stroke* .
          zip -r snow-pinyin.zip snow_* stroke.* lua
      - name: 预览安装包去掉腾讯词库和笔画
        run: |
          # rime-prelude 自带 default.yaml，仓库的 default.yaml 会被部署器当作过时副本移进 trash/
          echo -e "patch:\n  schema_list:\n    - { schema: snow_sipin }\n    - { schema: snow_sanpin }\n    - { schema: snow_yipin }\n    - { schema: snow_jiandao }\n    - { schema: snow_qingyun }" > default.custom.yaml
          sed -i -E '/^ *- snow_pinyin\.tencent$/d' snow_*.schema.yaml
          sed -i -E '/^ *- (snow_bihua|snow_jiandao_bihua|affix_segmentor@stroke|table_translator@stroke)$/d; /^ *(recognizer\/patterns\/)?stroke: /d' snow_*.schema.yaml
      - name: 编译
        run: rime_deployer --build . /usr/share/rime-data/
      - name: 打包预览安装包
        run: |
          zip -r snow-pinyin-build.zip build lua *.txt
      - name: 发布
        uses: comnoco/create-release-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: 冰雪拼音 ${{ github.ref }}
      - name: 上传
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "*.zip"
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
