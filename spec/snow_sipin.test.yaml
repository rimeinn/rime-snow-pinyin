schema: snow_sipin
source_dir: ..
script: |
  -- 候选在整个候选列表中的位置，不存在时返回 math.huge
  function rank(something)
    for i, v in ipairs(cand) do
      if v.text == something then
        return i
      end
    end
    return math.huge
  end
  function has(something)
    return rank(something) < math.huge
  end
  -- 是否出现在首页（page_size 为 6）
  function page(something)
    return rank(something) <= 6
  end
  function pinned(index)
    return cand[index] ~= nil and cand[index].comment:find("📌") ~= nil
  end
deploy:
  # 整句模式
  sentence:
    options:
      popping: false
    tests:
      - send: bieixou
        assert: cand[1].text == "冰雪"
      # 《拼写规则》中的整句示例
      - send: hioifieeviufoeabieixoupioifioi
        assert: cand[1].text == "欢迎使用冰雪拼音"
  # 构词规则、固顶词、首选后置与顶功
  # 注意：这里的断言依赖词频未被本部署内的上屏改变，故上屏类测试一律放在最后
  popping:
    tests:
      # r5 并入 er5 后，原有字仍可按轻声儿输入
      - send: rioo
        assert: has("兒")
      # 组词规则
      - send: biei
        assert: has("冰")
      - send: bxouie
        assert: has("冰雪")
      - send: vrfau
        assert: has("输入法")
      - send: ymxsie
        assert: has("充满希望")
      - send: wsvrF
        assert: has("中文输入法")
      - send: whrmGHG
        assert: has("中华人民共和国")
      # 构词规则：先打各音节声母，不中则补末音节至三码，再补首音节至三码
      # 单音节词
      - send: f
        assert: cand[1].text == "有"
      - send: fo
        assert: cand[1].text == "又"
      - send: fou
        assert: cand[1].text == "由"
      # 双音节词
      - send: nh
        assert: cand[1].text == "你好"
      - send: xsi
        assert: cand[1].text == "希望"
      - send: vjii
        assert: cand[1].text == "手机"
      - send: bxoui
        assert: cand[1].text == "冰雪"
      - send: kqiaoo
        assert: cand[1].text == "元气"
      # 三音节词
      - send: svm
        assert: cand[1].text == "为什么"
      - send: bfqi
        assert: cand[1].text == "变压器"
      # 文档称「最低点」的编码为 zdduo，实际词库中该编码的首选是「再大点」
      - send: zdduo
        assert: page("最低点")
      # 四音节词
      - send: gtvv
        assert: cand[1].text == "感同身受"
      - send: jjjji
        assert: cand[1].text == "将计就计"
      - send: ffffuu
        assert: cand[1].text == "附庸风雅"
      # 五音节及以上词：第五个声母起用大写
      - send: kxfwG
        assert: cand[1].text == "科学发展观"
      - send: rmdkXS
        assert: cand[1].text == "哀莫大于心死"
      # 固顶词：每类只取一例
      # 单音节词一码
      - send: d
        assert: cand[1].text == "都"
      # 单音节词二码
      - send: vu
        assert: cand[1].text == "数"
      # 单音节词三码
      - send: jie
        assert: cand[1].text == "及"
      # 双音节词二码
      - send: xq
        assert: cand[1].text == "下去"
      # 语义集中的区块（「事物代词」），码长成组
      - send: wg
        assert: cand[1].text == "这个"
      # 可选的无理音节：未强制使用时，常规音节码依然有效
      - send: wheu
        assert: cand[1].text == "周三"
      # 未强制时 rlrs 上同时存在「二零二四」和「二零二五」
      - send: rlrs
        assert: has("二零二四") and has("二零二五")
      - send: rlrg
        assert: cand[1].text == "二零二五"
      # 首选后置：已在首选出现过的词在后续编码中不再位于首选
      - send: jieo
        assert: cand[2].text == "及"
      - send: bxoui
        assert: cand[1].text == "冰雪"
      - send: bxouie
        assert: cand[1].text ~= "冰雪" and has("冰雪")
      # 顶功：元音之后出现辅音即把前一个词顶上屏
      - send: fisu
        assert: commit == "以" and cand[1].text == "为"
      - send: xsin
        assert: commit == "希望" and cand[1].text == "你"
      - send: mmmmmm
        assert: commit == "密密麻麻" and cand[1].text == "慢慢"
      - send: bxouivrf
        assert: commit == "冰雪" and cand[1].text == "输入法"
      # 只有辅音的编码不可顶，需空格上屏
      - send: "nh "
        assert: commit == "你好"
      # 四音节及更长的词即使只有辅音也可以被顶
      - send: gtvvsvm
        assert: commit == "感同身受" and cand[1].text == "为什么"
      # 顶标点：`;` 是「的」、`/` 是「了」
      - send: "wg;"
        assert: commit == "这个的"
      - send: "wg/"
        assert: commit == "这个了"
      # 分号与顿号的替代键位
      - send: "|"
        assert: commit == "；"
      - send: "\\"
        assert: commit == "、"
  # 动态码长与自动造词：这些测试会改变词频并写入音节码用户词典
  encoding:
    tests:
      # 动态码长：第一次需要多打几码，上屏之后下一次只需较少码
      - send: vvi
        assert: cand[1].text == "事实"
      - send: vviii
        assert: cand[1].text == "史诗"
      - send: vviiivvi
        assert: commit == "史诗" and cand[1].text == "史诗"
      - send: "bxoui bxo"
        assert: cand[1].text == "冰雪"
      # 选择造词：选 4 号候选「冰」，再空格确认「四」
      - send: bsiaie
        assert: not has("冰四")
      - send: "bsiaie8 bsiaie"
        assert: has("冰四")
      - send: "spioia22spi"
        assert: cand[1].text == "四拼"
      # 定位造词：`1` 定位到第一个音节后，补码确认「谱」再确认「方法」
      - send: pffau
        assert: not has("谱方法")
      - send: "pffau1uu22pffau"
        assert: has("谱方法")
      # 定位造词：`4` 定位到第二个音节后（2 + 2）
      - send: "sfdvua4eoui3ai sfdvua"
        assert: has("微分代数")
      # 定位造词：`5` 定位到第三个音节后（3 + 2）
      - send: "tdjkL5ui2i tdjkL"
        assert: has("态叠加原理")
      # 组句造词：词库中没有「密度矩阵」，但可由「密度」「矩阵」组合猜出
      - send: "jweoa mdjweoia"
        assert: cand[1].text == "密度矩阵"
  buffered_command:
    tests:
      - send: o
        assert: cand[1].text == "📝 开启缓冲" and commit == nil
      - send: "o "
        assert: commit == nil and preedit == nil
      # 取消命令不应开启缓冲；正常空格仍直接上屏
      - send: "o{Escape}d "
        assert: commit == "都"
      # 确认命令后分片输入，整句上屏后恢复非缓冲模式
      - send: "o bxouivrf "
        assert: commit == nil
      - send: "o bxouivrf  d "
        assert: commit == "冰雪输入法都"
      # 缓冲模式下显示关闭命令，选中后不上屏文字并恢复直接上屏
      - send: "o o"
        assert: cand[1].text == "📝 关闭缓冲" and commit == nil
      - send: "o o "
        assert: commit == nil and preedit == nil
      - send: "o o d "
        assert: commit == "都"
      # 取消关闭命令仍保留缓冲，再次开启也能正常缓冲
      - send: "o o{Escape}kr qz"
        assert: commit == nil and cand[1].text == "裙子"
      - send: "o o o kr qz"
        assert: commit == nil and cand[1].text == "裙子"
  # 缓冲造词与英数混输造词
  buffered:
    tests:
      # 缓冲造词：Control+j 进入造词模式，分片输入后再按一次空格
      - send: "{Control+j}bxouivrf  bxvrF"
        assert: cand[1].text == "冰雪输入法"
      - send: "{Control+j}kr qz  krqz"
        assert: cand[1].text == "可爱裙子"
      # 英数混输造词：辅音字母 = 字母 + oo，大写固定在三码首选、小写次选
      - send: boo
        assert: cand[1].text == "B" and cand[2].text == "b"
      # 元音字母 = se + 字母
      - send: sea
        assert: cand[1].text == "A" and cand[2].text == "a"
      # j, q, x, k 的三码首选被 `*oo` 的高频字占据，故大写退到次选、小写到三选
      - send: joo
        assert: cand[2].text == "J" and cand[3].text == "j"
      # 阿拉伯数字与中文数字同码，中文数字首选、阿拉伯数字次选
      - send: fii
        assert: cand[1].text == "一" and cand[2].text == "1"
      # 选择键为空格与 2, 3, 8, 9, 0
      - send: fii2
        assert: commit == "1"
      # 英数混输词
      - send: "ggtxio1ue21oo  ggtx"
        assert: cand[1].text == "5G通信"
      - send: "{Control+j}doi la sea mee  dlsm"
        assert: cand[1].text == "哆啦A梦"
  # 高级功能
  advanced:
    tests:
      # 以词定字：`[` 取首字、`]` 取末字
      - send: "xxrr["
        assert: commit == "熙"
      - send: "xxrr]"
        assert: commit == "攘"
      # 词不在首选时先用方向键选中再定字
      - send: "csuiai{Down}{Down}]"
        assert: commit == "薇"
      # 拼音反查（`a` 引导）
      - send: ashi
        assert: cand[1].text == "是"
      # 笔画反查（`u` 引导，横竖撇点折为 eiuoa）
      - send: ueiuoa
        assert: cand[1].text == "札"
      # 重复上屏（`i` 引导）
      - send: "yfu i"
        assert: cand[1].text == "重复"
      # 符号（`i` 引导）
      - send: ia
        assert: cand[1].text == "ā"
      # Lua 脚本：数字转中文数字
      - send: o123
        assert: cand[1].text == "一百二十三" and has("壹佰贰拾叁")
      # Unicode 码点：十六进制不区分大小写，支持基本平面以外的字符
      - send: o4e00
        assert: cand[1].text == "一" and cand[1].comment:find("U+4E00 CJK", 1, true) ~= nil
      - send: o4E00
        assert: cand[1].text == "一"
      - send: o20000
        assert: has("𠀀") and cand[rank("𠀀")].comment:find("CJK-B", 1, true) ~= nil
      - send: o1f600
        assert: cand[1].text == "😀"
      # 纯数字输入仍保留数字翻译的首选，同时提供对应的 Unicode 字符
      - send: o41
        assert: cand[1].text == "四十一" and has("A")
      # 代理码点、超出 Unicode 范围及非法十六进制不产生字符候选
      - send: od800
        assert: not has(utf8.char(0xd800))
      - send: o110000
        assert: not has(utf8.char(0x110000))
      - send: o4e00g
        assert: not has("一")
      # Lua 脚本：计算表达式
      - send: o1234*5678
        assert: has("7006652")
      # Lua 脚本：日期与时间（只检查格式）
      - send: orq
        assert: cand[1].text:match("^%d+年%d+月%d+日$") ~= nil
      - send: osj
        assert: cand[1].text:match("^%d+时%d+分%d+秒$") ~= nil
      - send: ors
        assert: cand[1].text:match("^%d+年%d+月%d+日%d+时%d+分%d+秒$") ~= nil
      # 输入统计：相对日期、绝对日期与年份、ISO 周和全部设备
      - send: otj
        assert: cand[1].text == "📖 统计功能说明" and cand[2].text:match("^📊 ") ~= nil
      - send: 'otj '
        assert: commit:match("^📖 冰雪输入统计使用说明") ~= nil and commit:find("otjr-1", 1, true) ~= nil and commit:find("选择设备", 1, true) ~= nil and commit:find("均速", 1, true) == nil
      - send: otjr-1
        assert: cand[1].text:match("^📊 %d+ 月 %d+ 日$") ~= nil
      - send: otjr+1
        assert: cand[1] == nil or cand[1].text:match("^📊 ") == nil
      - send: otj20261026
        assert: cand[1].text == "📊 10 月 26 日"
      - send: otj2026
        assert: cand[1].text == "📊 2026 年"
      - send: otj2026w44
        assert: cand[1].text == "📊 44 周"
      - send: otjhq
        assert: cand[1].text == "📊 有史以来"
      # 略码：完整重复，一字词用 `[`
      - send: "yi["
        assert: commit == "吃吃"
      # 略码：完整重复，双音节及以上的词用 `A`
      - send: "wgA"
        assert: commit == "这个这个"
      - send: "yvia{Down}{Down}A"
        assert: commit == "尝试尝试"
      # 略码：ＡＡＢＢ 型用 `O`
      - send: "krO"
        assert: commit == "可可爱爱"
      # 略码：部分重复，`E` 重复首字、`I` 重复末字
      - send: "dpaiE"
        assert: commit == "打打牌"
      - send: "dlqouE"
        assert: commit == "打打篮球"
      - send: "vjuuI"
        assert: commit == "睡觉觉"
      # 略码：插入重复，B 不、F 一、D 的、L 了、R 啊、U 呀
      - send: "haB"
        assert: commit == "好不好"
      - send: "krB"
        assert: commit == "可爱不可爱"
      - send: "haF"
        assert: commit == "好一好"
      - send: "haD"
        assert: commit == "好的好"
      - send: "haL"
        assert: commit == "好了好"
      - send: "haR"
        assert: commit == "好啊好"
      - send: "haU"
        assert: commit == "好呀好"
      # 略码：Ａ着Ａ着 用 `W`、Ａ来Ａ去 用 `Q`
      - send: "haW"
        assert: commit == "好着好着"
      - send: "haQ"
        assert: commit == "好来好去"
      # TODO: 文档中「Ａ了一Ａ」的略码 `K` 在 lua/snow/abbreviation.lua 中尚无对应分支，
      # 实现后补充：
      # - send: "haK"
      #   assert: commit == "好了一好"
      # 笔画辅助码：音节码之后直接加笔画
      - send: kooeei
        assert: page("芫")
      # 无韵尾音节先补一个 `o` 补全 4 码，再加笔画
      - send: fiaooe
        assert: page("翊")
      # 部首辅助码：`1` 引导，再打部首的音节码；「嶅」用笔画筛选没有效率
      - send: raueee
        assert: not page("嶅")
      - send: raue1v
        assert: page("嶅")
      - send: wia1m
        assert: cand[1].text == "桎"
      # 只打 2 码（不打声调）也可以接部首辅助码
      - send: fa1s
        assert: cand[1].text == "罚"
      # 部首库未收录「祇」：不能把未知部首当成与辅助码不匹配。
      - send: qie1s
        assert: has("祇")
  # 方案码用户词典：这些操作会写入 snow_sipin.userdb，故单独部署并按顺序执行
  schema_userdb:
    tests:
      # 固定：Control+; 把当前候选固定到当前位置
      - send: bma
        assert: not pinned(1)
      - send: "bma{Control+semicolon}bma"
        assert: cand[1].text == "编码" and pinned(1)
      # 取消固定：对已固定的候选再按一次 Control+;
      - send: "bma{Control+semicolon}bma"
        assert: not pinned(1)
      # 自由加词：Control+' → 任意方式输入 → Control+'
      # 无编码时的大写字母、数字由应用直接插入，不经 Rime 上屏，也要记进新词
      - send: "kfc{Control+apostrophe}fkxqS Vs 50{Control+apostrophe}kfc"
        assert: cand[1].text == "疯狂星期四V我50"
      # 自由加词也要捕获以词定字，以及略码前后两部分的直接上屏
      - send: "kfc{Control+backslash}{Control+apostrophe}xxrr[{Control+apostrophe}kfc"
        assert: cand[1].text == "熙"
      - send: "kfc{Control+backslash}{Control+apostrophe}xxrr]{Control+apostrophe}kfc"
        assert: cand[1].text == "攘"
      - send: "kfc{Control+backslash}{Control+apostrophe}krO{Control+apostrophe}kfc"
        assert: cand[1].text == "可可爱爱"
      - send: "kfc{Control+backslash}{Control+apostrophe}dpaiE{Control+apostrophe}kfc"
        assert: cand[1].text == "打打牌"
      - send: "kfc{Control+backslash}{Control+apostrophe}wgA{Control+apostrophe}kfc"
        assert: cand[1].text == "这个这个"
      # 加词时若第一候选已固定，新词加到第二候选
      - send: "dna{Control+semicolon}{Control+apostrophe}tfhtHS {Control+apostrophe}dna"
        assert: cand[1].text == "电脑" and cand[2].text == "脱氧核糖核酸"
      # 后移：Control+] 把已固定的候选往后移一位，与另一个已固定的候选交换位置
      - send: "kooe{Control+semicolon}{Down}{Control+semicolon}{Up}"
        assert: cand[1].text == "圆" and cand[2].text == "原"
      - send: "kooe{Control+bracketright}kooe"
        assert: cand[1].text == "原" and cand[2].text == "圆"
      # 前移：Control+[
      - send: "kooe{Down}{Control+bracketleft}kooe"
        assert: cand[1].text == "圆" and cand[2].text == "原"
      # 重置：Control+\ 取消当前编码上的所有自定义
      - send: "kooe{Control+backslash}kooe"
        assert: not pinned(1) and not pinned(2)
      # 位置编码只支持 1～18；超出的固定操作应保持候选不变，不能写成禁用或回绕到首位
      - send: "kooe{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Control+semicolon}"
        assert: not pinned(19) and not pinned(1)
      - send: "kooe{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Control+semicolon}"
        assert: not pinned(21) and not pinned(1)
      - send: "kooe{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Down}{Control+semicolon}"
        assert: pinned(18)
  # 无理音节
  special:
    patch:
      speller/force_special: true
    tests:
      - send: "heu"
        assert: cand[1].text == "三"
      - send: "sao"
        assert: not has("三")
      # 强制无理音节后，「二零二四」与「二零二五」完全分离
      - send: "rlrs"
        assert: has("二零二四") and not has("二零二五")
      - send: "rlrg"
        assert: cand[1].text == "二零二五"
  shape_g:
    tests:
      # 不配置来源时，反查和辅助码都默认只启用 G。
      # 同一个字的不同地区笔顺必须分别筛选，反查和辅助码一致。
      - send: uuooao
        assert: has("令")
      - send: uuoeao
        assert: not has("令")
      - send: uuoeai
        assert: not has("令")
      - send: lieauooao
        assert: has("令")
      - send: lieauoeao
        assert: not has("令")
      # 无标签的字形始终可用。
      - send: uoo
        assert: has("⺀")
  shape_t:
    patch:
      translator/shape_sources: [T]
    tests:
      - send: uuoeao
        assert: has("令")
      - send: uuooao
        assert: not has("令")
      - send: lieauoeao
        assert: has("令")
      - send: lieauooao
        assert: not has("令")
  shape_j:
    patch:
      translator/shape_sources: [J]
    tests:
      - send: uuoeai
        assert: has("令")
      - send: uuoeao
        assert: not has("令")
  shape_union:
    patch:
      translator/shape_sources: [G, T]
    tests:
      - send: uuooao
        assert: has("令")
      - send: uuoeao
        assert: has("令")
      - send: uuoeai
        assert: not has("令")
  shape_none:
    patch:
      translator/shape_sources: []
    tests:
      - send: uuooao
        assert: not has("令")
      - send: lieau
        assert: not has("令")
