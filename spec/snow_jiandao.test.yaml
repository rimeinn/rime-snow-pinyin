schema: snow_jiandao
source_dir: ..
script: |
  -- 候选在整个候选列表中的位置，不存在时返回 math.huge
  function rank(something)
    for i, v in ipairs(cand) do
      if v.text == something then
        return i
      end
    end
    return math.huge
  end
  function has(something)
    return rank(something) < math.huge
  end
  -- 是否出现在首页（page_size 为 6）
  function page(something)
    return rank(something) <= 6
  end
  function pinned(index)
    return cand[index] ~= nil and cand[index].comment:find("📌") ~= nil
  end
deploy:
  sentence:
    patch:
      'switches/@4/reset': 0
    tests:
      - send: bgxhpbyb
        assert: cand[1].text == "冰雪拼音"
  popping:
    tests:
      # r5 不应占用单键 r，仍能查询其他 r 声母的字
      - send: r
        assert: page("人") and has("日")
      # r5 并入 er5 后，原有字仍可按儿输入
      - send: xj
        assert: has("兒")
      # 组词规则
      - send: bgxh
        assert: has("冰雪")
      - send: erf
        assert: has("输入法")
      - send: wmxw
        assert: has("充满希望")
      - send: fwerF
        assert: has("中文输入法")
      - send: fhrmGHG
        assert: has("中华人民共和国")
      # 四字及以上词：前四字声母 + 每字形码首码，可只补前缀
      - send: sxwjvv
        assert: cand[1].text == "三下五除二"
      - send: sxwjvvva
        assert: cand[1].text == "三下五除二"
      - send: sxwjvvvav
        assert: cand[1].text == "三下五除二"
      # 五字词可用第五字形码与四字词区分
      - send: kxfq
        assert: has("科学发展") and has("科学发展观")
      - send: kxfquo
        assert: page("科学发展") and page("科学发展观")
      - send: kxfquoa
        assert: page("科学发展") and page("科学发展观")
      - send: kxfquoaa
        assert: page("科学发展") and page("科学发展观")
      - send: kxfquoaaa
        assert: page("科学发展观") and not has("科学发展")
      - send: kxfquoaav
        assert: not has("科学发展观")
      # 第三、第四字的形码均参与筛选
      - send: kxfquov
        assert: not has("科学发展") and not has("科学发展观")
      - send: kxfquoav
        assert: not has("科学发展") and not has("科学发展观")
      # 七字词也能逐字补全形码
      - send: fhrm
        assert: has("中华人民") and has("中华人民共和国")
      - send: fhrmii
        assert: page("中华人民") and page("中华人民共和国")
      - send: fhrmiiia
        assert: page("中华人民") and page("中华人民共和国")
      - send: fhrmiiiavui
        assert: page("中华人民共和国") and not has("中华人民")
      - send: fhrmiiiavuv
        assert: not has("中华人民共和国")
      # 用大写字母补完其余声母则重码更低，且不影响顶功
      - send: kxfqG
        assert: cand[1].text == "科学发展观"
      # 固顶词：一至三码的一字词
      - send: p
        assert: cand[1].text == "平"
      - send: xh
        assert: cand[1].text == "学"
      - send: bgov
        assert: cand[1].text == "冰"
      - send: bb
        assert: cand[1].text == "宾"
      - send: bba
        assert: cand[1].text == "滨"
      # 固顶词：声声简词
      - send: be
        assert: cand[1].text == "表示"
      # 固顶词：630 简词
      - send: yi
        assert: cand[1].text == "一个"
      - send: ba
        assert: cand[1].text == "不能"
      - send: baa
        assert: cand[1].text == "步骤"
      # 首选后置
      - send: ekek
        assert: cand[1].text == "事实"
      - send: ekekv
        assert: cand[2].text == "事实"
      - send: bgxh
        assert: cand[1].text == "冰雪"
      - send: bgxho
        assert: cand[1].text ~= "冰雪" and has("冰雪")
      # 顶功
      - send: yiyi
        assert: commit == "一个" and cand[1].text == "一个"
      - send: bgovxhv
        assert: commit == "冰" and cand[1].text == "雪"
      - send: pbyberf
        assert: commit == "拼音" and cand[1].text == "输入法"
      # 大写补码也能顶功
      - send: kxfqGbgxh
        assert: commit == "科学发展观" and cand[1].text == "冰雪"
      # 选择键为 1 ~ 6
      - send: be2
        assert: commit == "B"
      # 动态码长
      - send: "ekekiiekek"
        assert: cand[1].text == "誓师"
      - send: ekekio
        assert: cand[1].text == "史诗"
      - send: ekekioekek
        assert: commit == "史诗" and cand[1].text == "史诗"
  # 混合声韵拼写：韵母和形码不计入四个声母的分界
  mixed_spelling:
    tests:
      # 空输入时大写字母仍直接输入西文
      - send: X
        assert: preedit == nil and commit == nil
      # 前三个字均可单独补韵母，也可以同时补
      - send: eJrf
        assert: has("输入法") and preedit == "eJ r f"
      - send: erJf
        assert: has("输入法") and preedit == "e rJ f"
      - send: erfS
        assert: has("输入法") and preedit == "e r fS"
      - send: eJrJfS
        assert: has("输入法") and preedit == "eJ rJ fS"
      - send: erfK
        assert: not has("输入法")
      # 沿用原生拼写派生，支持飞键
      - send: zKxGjE
        assert: has("自行车") and preedit == "zK xG jE"
      # 两字词仍使用原来的双拼，不用大写韵母
      - send: bGxH
        assert: not has("冰雪")
      # 补过韵母后仍可输入第四个声母
      - send: kExHfSq
        assert: has("科学发展") and commit == nil
      # 已有四个声母时，大写沿用追加长词声母的行为
      - send: kExHfSqG
        assert: has("科学发展观") and preedit == "kE xH fS q g"
      - send: fYhrmGHG
        assert: has("中华人民共和国") and preedit == "fY h r m g h g"
      # 补韵母后可继续补形码
      - send: eJrJfSv
        assert: has("输入法")
      - send: eJrJfSa
        assert: not has("输入法")
      - send: kExHfSquoaa
        assert: has("科学发展")
      # 先加形再补末字韵母，与先补韵再加形等价
      - send: erfvS
        assert: has("输入法") and preedit == "e r fS 形 [v]" and commit == nil
      - send: erfvuS
        assert: has("输入法") and preedit == "e r fS 形 [vu]" and commit == nil
      - send: erfvuaS
        assert: has("输入法") and preedit == "e r fS 形 [vua]" and commit == nil
      - send: erfSvua
        assert: has("输入法") and preedit == "e r fS 形 [vua]" and commit == nil
      - send: eJrfvuS
        assert: has("输入法") and preedit == "eJ r fS 形 [vu]" and commit == nil
      - send: erJfvuS
        assert: has("输入法") and preedit == "e rJ fS 形 [vu]" and commit == nil
      - send: erfvuK
        assert: not has("输入法") and commit == nil
      - send: erfvSua
        assert: has("输入法") and preedit == "e r fS 形 [vua]" and commit == nil
      # 先补形再补韵，退格仍优先删除形码，取消后无残留
      - send: erfvuS{BackSpace}
        assert: has("输入法") and preedit == "e r fS 形 [v]" and commit == nil
      - send: erfvuS{Escape}erf
        assert: has("输入法") and preedit == "e r f" and commit == nil
      # 退格直接删除真实编码中的韵母，取消后也没有残留状态
      - send: erfS{BackSpace}
        assert: has("输入法") and preedit == "e r f"
      - send: erfS{BackSpace}K
        assert: not has("输入法")
      - send: eJrJfS{Escape}erf
        assert: has("输入法") and preedit == "e r f"
      # 形码完成的三字词、四个声母后的长词仍能顶功
      - send: eJrJfSvbgxh
        assert: commit == "输入法" and has("冰雪")
      - send: erfvuSbgxh
        assert: commit == "输入法" and has("冰雪")
      - send: kExHfSqGbgxh
        assert: commit == "科学发展观" and has("冰雪")
      - send: "zKxGjE "
        assert: commit == "自行车"
  # 自动造词
  encoding:
    tests:
      # 选择造词：「星猫」不在词库中，补「星」的形码 oi 把它提到首选，
      # 空格确认后再补「猫」的形码 ua，再次空格即造好词
      - send: xgmz
        assert: not has("星猫")
      - send: xgmzoi
        assert: cand[1].text == "星"
      - send: "xgmzoi ua"
        assert: cand[1].text == "猫"
      - send: "xgmzoi ua  xgmz"
        assert: cand[1].text == "星猫"
      # 缓冲造词（拆分输入的片段不能使用 630 简码）
      - send: "{Control+j}jp mzua  jpmz"
        assert: cand[1].text == "长猫"
      - send: "{Control+j}bgxherf  bxero"
        assert: cand[1].text == "冰雪输入法"
      # 英数混输造词：bpmfdtnlgkhjqxzcsrywe 加后缀 e，
      # 大写字母固定在二码的次选、小写字母在三选
      - send: be
        assert: cand[2].text == "B" and cand[3].text == "b"
      # viuoa 的音节码是 x 加对应的韵母，v 被占用故规定为 xh
      - send: xk
        assert: cand[2].text == "I" and cand[3].text == "i"
      - send: xh
        assert: cand[2].text == "V" and cand[3].text == "v"
      # 阿拉伯数字与相应中文数字同码
      - send: xj
        assert: cand[1].text == "二" and cand[2].text == "2"
      - send: "{Control+j}wjv2ge2tyxb  wgtx"
        assert: cand[1].text == "5G通信"
      - send: "{Control+j}dlou lso xs2mr  dlxm"
        assert: cand[1].text == "哆啦A梦"
  buffered_command:
    tests:
      - send: o
        assert: cand[1].text == "📝 开启缓冲" and commit == nil
      - send: "o "
        assert: commit == nil and preedit == nil
      - send: "o{Escape}erf "
        assert: commit == "输入法"
      - send: "o bgxherf "
        assert: commit == nil
      - send: "o bgxherf  erf "
        assert: commit == "冰雪输入法输入法"
      - send: "o o"
        assert: cand[1].text == "📝 关闭缓冲" and commit == nil
      - send: "o o "
        assert: commit == nil and preedit == nil
      - send: "o o erf "
        assert: commit == "输入法"
      - send: "o o{Escape}jp mzua"
        assert: commit == nil and cand[1].text == "猫"
      - send: "o o o jp mzua"
        assert: commit == nil and cand[1].text == "猫"
  # 高级功能
  advanced:
    tests:
      # 拼音反查（`a` 引导）
      - send: ashi
        assert: cand[1].text == "是"
      # 笔画反查（`u` 引导，横竖撇点折为 viuoa）
      - send: uviuoa
        assert: cand[1].text == "札"
      # 重复上屏（`i` 引导）
      - send: "wyfj i"
        assert: cand[1].text == "重复"
      # 符号（`i` 引导）
      - send: ia
        assert: cand[1].text == "ā"
      # Lua 脚本：数字转中文数字
      - send: o123
        assert: cand[1].text == "一百二十三" and has("壹佰贰拾叁")
      # Unicode 码点
      - send: o4e00
        assert: cand[1].text == "一"
      # Lua 脚本：计算表达式
      - send: o1234*5678
        assert: has("7006652")
      # Lua 脚本：日期与时间（只检查格式）
      - send: orq
        assert: cand[1].text:match("^%d+年%d+月%d+日$") ~= nil
      - send: osj
        assert: cand[1].text:match("^%d+时%d+分%d+秒$") ~= nil
      - send: ors
        assert: cand[1].text:match("^%d+年%d+月%d+日%d+时%d+分%d+秒$") ~= nil
      # 以词定字：`[` 取首字、`]` 取末字
      - send: "xxrr["
        assert: commit == "熙"
      # 词不在首选时先用方向键选中再定字
      - send: "chww{Down}{Down}]"
        assert: commit == "薇"
  # 方案码用户词典：这些操作会写入 snow_jiandao.userdb，故单独部署并按顺序执行
  schema_userdb:
    tests:
      # 固定：Control+; 把当前候选固定到当前位置
      - send: bmms
        assert: not pinned(1)
      - send: "bmms{Control+semicolon}bmms"
        assert: cand[1].text == "编码" and pinned(1)
      # 取消固定：对已固定的候选再按一次 Control+;
      - send: "bmms{Control+semicolon}bmms"
        assert: not pinned(1)
      # 自由加词：Control+' → 任意方式输入 → Control+'
      # 无编码时的大写字母、数字由应用直接插入，不经 Rime 上屏，也要记进新词
      - send: "kfc{Control+apostrophe}fkxqS Vw 50{Control+apostrophe}kfc"
        assert: cand[1].text == "疯狂星期四V我50"
      # 加词时若第一候选已是固顶词，新词加到第二候选
      - send: "gc{Control+apostrophe}ljhev {Control+apostrophe}gc"
        assert: cand[1].text == "刚才" and cand[2].text == "垃圾回收"
      # 后移：Control+] 把已固定的候选往后移一位，与另一个已固定的候选交换位置
      - send: "jmdz{Control+semicolon}{Down}{Control+semicolon}{Up}"
        assert: cand[1].text == "见到" and cand[2].text == "剪刀"
      - send: "jmdz{Control+bracketright}jmdz"
        assert: cand[1].text == "剪刀" and cand[2].text == "见到"
      # 前移：Control+[
      - send: "jmdz{Down}{Control+bracketleft}jmdz"
        assert: cand[1].text == "见到" and cand[2].text == "剪刀"
      # 重置：Control+\ 取消当前编码上的所有自定义
      - send: "jmdz{Control+backslash}jmdz"
        assert: not pinned(1) and not pinned(2)
  shape_g:
    patch:
      translator/shape_sources: [G]
    tests:
      - send: "uuooao"
        assert: has("令")
      - send: "uuovao"
        assert: not has("令")
  shape_t:
    patch:
      translator/shape_sources: [T]
    tests:
      - send: "uuovao"
        assert: has("令")
      - send: "uuooao"
        assert: not has("令")
