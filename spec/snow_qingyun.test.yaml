schema: snow_qingyun
source_dir: ..
script: |
  -- 候选在整个候选列表中的位置，不存在时返回 math.huge
  function rank(something)
    for i, v in ipairs(cand) do
      if v.text == something then
        return i
      end
    end
    return math.huge
  end
  function has(something)
    return rank(something) < math.huge
  end
  -- 是否出现在首页（page_size 为 6）
  function page(something)
    return rank(something) <= 6
  end
  function pinned(index)
    return cand[index] ~= nil and cand[index].comment:find("\u{1F4CC}") ~= nil
  end
  function annotated(index, text)
    return cand[index] ~= nil and cand[index].comment:find(text) ~= nil
  end
deploy:
  # 全息模式：前缀码与顶功都不起作用，可以把每个字的形码打全参与组句
  sentence:
    options:
      popping: false
    tests:
      - send: kavoq/
        assert: cand[1].text == "清"
      # 「晶」的三个字根「日日日」的声码韵码全打
      - send: ririri
        assert: cand[1].text == "晶"
      - send: h;y/siy/b/xep.y.
        assert: cand[1].text == "欢迎使用冰雪拼音"
  popping:
    tests:
      # 组词规则
      - send: b/
        assert: has("冰")
      - send: bxe
        assert: has("冰雪")
      - send: srfa
        assert: has("输入法")
      - send: cmxw
        assert: has("充满希望")
      - send: zwsrF
        assert: has("中文输入法")
      - send: zhrmGHG
        assert: has("中华人民共和国")
      # 词语的前缀编码：先打前四个音节的声母，少于四个音节时追加末音节的韵母
      # 一音节词 s₁y₁
      - send: yi
        assert: page("一")
      # 二音节词 s₁s₂y₂
      - send: kyi
        assert: cand[1].text == "可以"
      # 三音节词 s₁s₂s₃y₃
      - send: wsme
        assert: page("为什么")
      # 四音节词 s₁s₂s₃s₄
      - send: gtss
        assert: cand[1].text == "感同身受"
      # 多音节词 s₁s₂s₃s₄
      - send: kxfz
        assert: page("科学发展观")
      - send: vmdy
        assert: has("哀莫大于心死")
      - send: zhrm
        assert: page("中华人民共和国")
      # 三音节词只输入声母时也能检索，用空格上屏
      - send: "wsm "
        assert: commit == "为什么"
      # TODO: 文档称二音节词只输入声母（s₁s₂）时也会检索对应的字词，但实测
      # `zx` 上只有「声声空」码的单字「筑」，词「这些」并不在候选中。待确认后启用：
      # - send: zx
      #   assert: has("这些")
      # 单字的前缀编码：先打前三个字根和最后一个字根的声码，
      # 少于四个字根时追加末字根的韵码
      # 一字根字 s₁y₁
      - send: ri
        assert: cand[1].text == "日"
      # 二字根字 s₁s₂y₂
      - send: rri
        assert: cand[1].text == "昌"
      # 三字根字 s₁s₂s₃y₃
      - send: rrri
        assert: cand[1].text == "晶"
      # 四字根字 s₁s₂s₃s₄
      - send: rrrr
        assert: has("\u{232AD}")
      # 一字根字的补码：「十」和「巳」的编码都是 si，
      # 属于《通用规范汉字表》的「巳」有「重声韵」码 msi
      - send: si
        assert: cand[1].text == "十"
      - send: msi
        assert: page("巳")
      # 非《通用规范汉字表》的字根字有「重重声韵」码，如康熙部首的「\u{2F17}」
      - send: mmsi
        assert: page("\u{2F17}")
      # 词语的顶功编码：二音节词 s₁s₂y₂Y₁
      - send: kyiE
        assert: page("可以")
      # 三音节词 s₁s₂s₃y₃Y₁
      - send: wsmeE
        assert: page("为什么")
      # 四音节词 s₁s₂s₃s₄Y₄ 和 s₁s₂s₃s₄Y₄Y₁
      - send: gtssA
        assert: page("感同身受")
      - send: "gtssA:"
        assert: page("感同身受")
      # 多音节词 s₁s₂s₃s₄S₅..Sₙ、+Yₙ、+Y₁
      - send: kxfzG
        assert: cand[1].text == "科学发展观"
      - send: "kxfzG:"
        assert: page("科学发展观")
      - send: "kxfzG:E"
        assert: page("科学发展观")
      - send: zhrmGHGO
        assert: page("中华人民共和国")
      # 单字的顶功编码：二字根字 s₁s₂y₂Y₁、三字根字 s₁s₂s₃y₃Y₁
      - send: rriI
        assert: page("昌")
      - send: rrriI
        assert: page("晶")
      # 四字根字 s₁s₂s₃s₄Y₄ 和 s₁s₂s₃s₄Y₄Y₁
      - send: rrrrI
        assert: page("\u{232AD}")
      - send: rrrrII
        assert: page("\u{232AD}")
      # 方案码固态词典（固顶词）：文档列出的每一类各取一例
      # GB2312 范围内以形码编码的单字，候选位置固定且比词语更优先
      - send: kv
        assert: cand[1].text == "清"
      # 单字的「韵」码：7 个，只有二根及以上字可能有此种编码
      - send: "e"
        assert: commit == "的"
      # 单字的「声空」码：21 个，取字的第一码加空格
      - send: "k "
        assert: commit == "来"
      # 单字的「声韵」码：80 个，第一码为字的第一码，第二码无理
      - send: je
        assert: cand[1].text == "多"
      # 单字的「声声空」码：403 个，取字的前两码加空格
      - send: "zx "
        assert: commit == "筑"
      # 词语的「声韵」码：19 个
      - send: yo
        assert: cand[1].text == "一个"
      # 词语的「声声韵」码：46 个
      - send: "mg;"
        assert: cand[1].text == "每个"
      # TODO: 文档还提到「声声声空」码「若干」，但未给出具体例子，待补充
      # 首选后置
      - send: ygeI
        assert: cand[2].text == "一个"
      # 顶功
      - send: fisu
        assert: commit == "吃" and cand[1].text == "什么"
      - send: xsin
        assert: commit == "现实" and cand[1].text == "看"
      - send: mmmmmm
        assert: commit == "密密麻麻" and cand[1].text == "步"
      # 选择键为空格与 2, 3, 8, 9, 0
      - send: bsi2
        assert: commit == "不是"
  # 动态码长与自动造词
  encoding:
    tests:
      # 动态码长：第一次需要补首音节的韵母，上屏之后下一次不必再补
      - send: tp.
        assert: cand[2].text == "调频"
      - send: tp.O
        assert: cand[1].text == "调频"
      - send: "tp.O tp."
        assert: commit == "调频" and cand[1].text == "调频"
      # 定位造词：`1` 定位到第一个音节后，补「冰」的韵母确认「冰」，再确认「四」
      - send: bsi
        assert: not has("冰四")
      - send: "bsi1/83bsi"
        assert: page("冰四")
      # 缓冲造词
      - send: "{Control+j}bxe? srfa2 bxsrF"
        assert: cand[1].text == "冰雪输入法"
      # 缓冲造词中的形音替换法：用形码输入单字参与造词，再从候选中选取正确的读音
      - send: "{Control+j}ppjg"
        assert: cand[1].text == "梦"
      - send: "{Control+j}ppjgkvna"
        assert: cand[1].text == "泽"
      - send: "{Control+j}ppjgkvnagnpa"
        assert: cand[1].text == "闲"
      - send: "{Control+j}ppjgkvnagnpabw"
        assert: cand[1].text == "客"
      - send: "{Control+j}ppjgkvnagnpabw  mzxk"
        assert: cand[1].text == "梦泽闲客"
      # 英数混输造词：阿拉伯数字固定在二码的次选，中文数字固定在二码的三选
      - send: yi
        assert: cand[2].text == "1" and cand[3].text == "一"
      - send: vi
        assert: cand[2].text == "2" and cand[3].text == "二"
      - send: "s;"
        assert: cand[2].text == "3" and cand[3].text == "三"
      - send: si
        assert: cand[2].text == "4" and cand[3].text == "四"
      - send: wu
        assert: cand[2].text == "5" and cand[3].text == "五"
      - send: la
        assert: cand[2].text == "6" and cand[3].text == "六"
      - send: qi
        assert: cand[2].text == "7" and cand[3].text == "七"
      - send: ba
        assert: cand[2].text == "8" and cand[3].text == "八"
      - send: ja
        assert: cand[2].text == "9" and cand[3].text == "九"
      - send: "l/"
        assert: cand[2].text == "0" and cand[3].text == "零"
      # 辅音字母加后缀 `.`，大写固定在二码的次选、小写在三选
      - send: "b."
        assert: cand[2].text == "B" and cand[3].text == "b"
      # 元音字母加前缀 `m`
      - send: ma
        assert: cand[2].text == "A" and cand[3].text == "a"
      - send: "{Control+j}wu2g.2lg lwo  wgtx"
        assert: cand[1].text == "5G通信"
      - send: "{Control+j}fjggfnlkma2ppjg  dlmm"
        assert: cand[1].text == "哆啦A梦"
  # 高级功能
  advanced:
    tests:
      # Unicode 注解：Control+u 显示汉字的 Unicode 编码和所属区块，
      # 用于分辨字形相同的不同汉字（「行」分属中日韩统一表意文字基本区和康熙部首）
      - send: dvme
        assert: cand[1].text == "行" and not annotated(1, "CJK")
      - send: dvme{Control+u}
        assert: annotated(1, "CJK") and annotated(2, "部首")
      # 不需要引导键，直接用拼音输入单个汉字并显示相应的形码
      - send: yi
        assert: cand[1].text == "已" and annotated(1, "yi")
      # 以词定字：`[` 取首字、`]` 取末字
      - send: "xxrr["
        assert: commit == "熙"
      - send: "xxrr]"
        assert: commit == "攘"
      # 词不在首选时先用方向键选中再定字
      - send: "cweI{Down}{Down}{Down}{Down}{Down}]"
        assert: commit == "薇"
      # 拼音反查（`` ` `` 引导）
      - send: "`shi"
        assert: cand[1].text == "是"
      # 笔画反查（`` ` `` 引导，横竖撇点折为 eiuoa）
      - send: "`eiuoa"
        assert: cand[1].text == "札"
      # 重复上屏（`` ` `` 引导）
      - send: "cfu? `"
        assert: cand[1].text == "重复"
      # Lua 脚本（两个 `` ` `` 引导）：数字、计算（含字母开头）、日期时间、输入统计
      - send: "``123"
        assert: cand[1].text == "一百二十三" and has("壹佰贰拾叁")
      - send: "``1234*5678"
        assert: has("7006652")
      - send: "``sqrt(16);"
        assert: has("4")
      - send: "``rq"
        assert: cand[1].text:match("^%d+年%d+月%d+日$") ~= nil
      - send: "``sj"
        assert: cand[1].text:match("^%d+时%d+分%d+秒$") ~= nil
      - send: "``rs"
        assert: cand[1].text:match("^%d+年%d+月%d+日%d+时%d+分%d+秒$") ~= nil
      - send: "``tj"
        assert: cand[1].text:match("^今日 %d+ 字") ~= nil and cand[4].text:match("^本年 %d+ 字") ~= nil
      - send: "``tjq"
        assert: cand[1].text:match("^今日 %d+ 字") ~= nil and cand[4].text:match("^本年 %d+ 字") ~= nil
      - send: "``tjs"
        assert: cand[1].text:match("（本机） 今日 %d+ 字") ~= nil
      - send: "``tjd"
        assert: cand[1].text:match("snow_statistics%.tsv$") ~= nil
  # 方案码用户词典：这些操作会写入 snow_qingyun.userdb，故单独部署并按顺序执行
  schema_userdb:
    tests:
      # 固定：Control+; 把当前候选固定到当前位置
      - send: bma
        assert: cand[1].text == "编码" and not pinned(1)
      - send: "bma{Control+semicolon}bma"
        assert: cand[1].text == "编码" and pinned(1)
      # 取消固定：对已固定的候选再按一次 Control+;
      - send: fhe
        assert: cand[1].text == "符合" and pinned(1)
      - send: "fhe{Control+semicolon}fhe"
        assert: cand[1].text == "发挥"
      # 自由加词：Control+' → 任意方式输入 → Control+'
      # 无编码时的大写字母、数字由应用直接插入，不经 Rime 上屏，也要记进新词
      - send: "kfc{Control+apostrophe}fkxqS Vo50{Control+apostrophe}kfc"
        assert: cand[1].text == "疯狂星期四V我50"
      # 加词时若第一候选已固定，新词加到第二候选
      - send: "dna{Control+apostrophe}tyhtHS {Control+apostrophe}dna"
        assert: cand[1].text == "半" and cand[2].text == "脱氧核糖核酸"
      # 后移：Control+] 把已固定的候选往后移一位，与另一个已固定的候选交换位置
      - send: fmje
        assert: cand[1].text == "吧" and cand[2].text == "邑"
      - send: "fmje{Control+bracketright}fmje"
        assert: cand[1].text == "邑" and cand[2].text == "吧"
      # 前移：Control+[
      - send: "fmje{Down}{Control+bracketleft}fmje"
        assert: cand[1].text == "吧" and cand[2].text == "邑"
      # 重置：Control+\ 取消当前编码上的所有自定义
      - send: "fmje{Control+backslash}fmje"
        assert: cand[1].text == "吧" and cand[2].text == "邑"
