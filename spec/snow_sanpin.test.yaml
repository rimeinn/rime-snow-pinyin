schema: snow_sanpin
source_dir: ..
script: |
  -- 候选在整个候选列表中的位置，不存在时返回 math.huge
  function rank(something)
    for i, v in ipairs(cand) do
      if v.text == something then
        return i
      end
    end
    return math.huge
  end
  function has(something)
    return rank(something) < math.huge
  end
  -- 是否出现在首页（page_size 为 6）
  function page(something)
    return rank(something) <= 6
  end
  function pinned(index)
    return cand[index] ~= nil and cand[index].comment:find("📌") ~= nil
  end
deploy:
  # 整句模式（练习模式）：顶功与后置都不起作用，打全声韵调三码参与组句
  sentence:
    patch:
      'switches/@4/reset': 0
    tests:
      - send: bgxhpbyb
        assert: cand[1].text == "冰雪拼音"
      - send: bgvxhupbvybv
        assert: cand[1].text == "冰雪拼音"
  popping:
    tests:
      # 组词规则
      - send: bgv
        assert: cand[1].text == "冰"
      - send: bgxh
        assert: has("冰雪")
      - send: jbekoo
        assert: has("近世")
      - send: erf
        assert: has("输入法")
      - send: bhhviv
        assert: has("白花花")
      - send: wmxw
        assert: has("充满希望")
      - send: jjjjuv
        assert: has("经济基础")
      - send: fwerF
        assert: has("中文输入法")
      - send: fhrmGHG
        assert: has("中华人民共和国")
      # 构词规则：单音节词全码为「声韵调」，简码为前 1 码或前 2 码
      - send: p
        assert: cand[1].text == "平"
      - send: xh
        assert: cand[1].text == "学"
      - send: bg
        assert: cand[1].text == "并"
      # 构词规则：双音节词全码为「声₁韵₁声₂韵₂调₂调₁」，简码为前 4 码或前 5 码
      - send: bgxhu
        assert: has("冰雪")
      - send: bgxhuv
        assert: page("冰雪")
      # 构词规则：三音节词全码为「声₁声₂声₃调₃调₁调₂」，简码为前 3、4 或 5 码
      - send: erfu
        assert: page("输入法")
      - send: erfuv
        assert: page("输入法")
      - send: erfuvo
        assert: page("输入法")
      # 构词规则：四音节及更多音节词全码为「声₁声₂声₃声₄调₄调₁」，简码为前 4 码或前 5 码
      - send: wmxwo
        assert: page("充满希望")
      - send: wmxwov
        assert: page("充满希望")
      # 固顶词：一码一字词
      - send: b
        assert: cand[1].text == "不"
      - send: d
        assert: cand[1].text == "的"
      - send: s
        assert: cand[1].text == "三"
      - send: y
        assert: cand[1].text == "一"
      # 固顶词：二码单字
      - send: bb
        assert: cand[1].text == "宾"
      # 固顶词：二简词（声₁声₂）
      - send: be
        assert: cand[1].text == "表示"
      - send: fg
        assert: cand[1].text == "中国"
      - send: gc
        assert: cand[1].text == "刚才"
      - send: yo
        assert: cand[1].text == "一个"
      # 固顶词：两键简词（声₁调₂）
      - send: ba
        assert: cand[1].text == "不了"
      - send: bi
        assert: cand[1].text == "不能"
      # 固顶词：三键简词，二字词为「声₁调₂调₁」
      - send: bai
        assert: cand[1].text == "别的"
      - send: biu
        assert: cand[1].text == "本来"
      # 固顶词：三键简词，多字词为「声₁调₂调₃」
      - send: bia
        assert: cand[1].text == "不然的话"
      # 首选后置
      - send: ekek
        assert: cand[1].text == "事实"
      - send: ekeki
        assert: cand[2].text == "事实"
      # 顶功
      - send: yoyo
        assert: commit == "一个" and cand[1].text == "一个"
      - send: bgvxhu
        assert: commit == "冰" and cand[1].text == "雪"
      - send: pbyberf
        assert: commit == "拼音" and cand[1].text == "输入法"
      # 单音节词在 1 码和 2 码时不可顶，需空格上屏
      - send: pbg
        assert: commit == nil or commit == ""
      - send: xhbg
        assert: commit == nil or commit == ""
      - send: "xh "
        assert: commit == "学"
      # 三音节词在 3 码时不可顶，需空格上屏
      - send: erfb
        assert: commit == nil or commit == ""
      - send: "erf "
        assert: commit == "输入法"
      # 选择键为 1 ~ 6
      - send: bea2
        assert: commit == "b"
      # 动态码长
      - send: "ekekvoekek"
        assert: cand[1].text == "誓师"
      - send: ekekvu
        assert: cand[1].text == "史诗"
      - send: ekekvuekek
        assert: commit == "史诗" and cand[1].text == "史诗"
  # 缓冲造词：本方案只支持这一种自动造词方式，不支持选择造词、定位造词等
  buffered:
    tests:
      - send: "{Control+j}jp mzv  jpmz"
        assert: cand[1].text == "长猫"
      - send: "{Control+j}bgxherf  bxerF"
        assert: cand[1].text == "冰雪输入法"
      # 英数混输造词：辅音字母 = 字母 + ea，大写固定在三码首选、小写次选
      - send: bea
        assert: cand[1].text == "B" and cand[2].text == "b"
      # 元音字母 = x + 对应韵母 + a
      - send: xsa
        assert: cand[1].text == "A" and cand[2].text == "a"
      # 阿拉伯数字与相应中文数字同码
      - send: "{Control+j}wju2geatyxb  wgtx"
        assert: cand[1].text == "5G通信"
      - send: "{Control+j}dlvlsvixsamr  dlxm"
        assert: cand[1].text == "哆啦A梦"
  # 高级功能
  advanced:
    tests:
      # 拼音反查（`a` 引导）
      - send: ashi
        assert: cand[1].text == "是"
      # 笔画反查（`u` 引导，横竖撇点折为 viuoa）
      - send: uviuoa
        assert: cand[1].text == "札"
      # 重复上屏（`i` 引导）
      - send: "wyfj i"
        assert: cand[1].text == "重复"
      # 符号（`i` 引导）
      - send: ia
        assert: cand[1].text == "ā"
      # Lua 脚本：数字转中文数字
      - send: o123
        assert: cand[1].text == "一百二十三" and has("壹佰贰拾叁")
      # Lua 脚本：计算表达式
      - send: o1234*5678
        assert: has("7006652")
      # Lua 脚本：日期与时间（只检查格式）
      - send: orq
        assert: cand[1].text:match("^%d+年%d+月%d+日$") ~= nil
      - send: osj
        assert: cand[1].text:match("^%d+时%d+分%d+秒$") ~= nil
      - send: ors
        assert: cand[1].text:match("^%d+年%d+月%d+日%d+时%d+分%d+秒$") ~= nil
      # 输入统计：本机、全部合并各给今日、本周、本月、本年、累计五条；各安装分列；tj 前加字母只看一个时段
      - send: otj
        assert: cand[1].text:match("^今日 %d+ 词，%d+ 字") ~= nil and cand[5].text:match("^累计 %d+ 词，%d+ 字") ~= nil
      - send: otjq
        assert: cand[1].text:match("^今日 %d+ 词，%d+ 字") ~= nil and cand[5].text:match("^累计 %d+ 词，%d+ 字") ~= nil
      - send: otjs
        assert: cand[1].text:match("（本机） 今日 %d+ 词，%d+ 字") ~= nil
      - send: oqtj
        assert: cand[1].text:match("^累计 %d+ 词，%d+ 字") ~= nil
      - send: ortjs
        assert: cand[1].text:match("（本机） 今日 %d+ 词，%d+ 字") ~= nil
      # 笔画辅助码：音节码之后直接加笔画
      - send: ytivi
        assert: page("芫")
      # 部首辅助码：`1` 引导，再打部首的音节码；「嶅」用笔画筛选没有效率
      - send: xzivv
        assert: not page("嶅")
      - send: xzi1e
        assert: cand[1].text == "嶅"
      # 以词定字：`[` 取首字、`]` 取末字
      - send: "xxrr["
        assert: commit == "熙"
      # 词不在首选时先用方向键选中再定字
      - send: "chww{Down}{Down}]"
        assert: commit == "薇"
  # 方案码用户词典：这些操作会写入 snow_sanpin.userdb，故单独部署并按顺序执行
  schema_userdb:
    tests:
      # 固定：Control+; 把当前候选固定到当前位置
      - send: bmms
        assert: not pinned(1)
      - send: "bmms{Control+semicolon}bmms"
        assert: cand[1].text == "编码" and pinned(1)
      # 取消固定：对已固定的候选再按一次 Control+;
      - send: "bmms{Control+semicolon}bmms"
        assert: not pinned(1)
      # 自由加词：Control+' → 任意方式输入 → Control+'
      # 无编码时的大写字母、数字由应用直接插入，不经 Rime 上屏，也要记进新词
      - send: "kfc{Control+apostrophe}fkxqS Vw 50{Control+apostrophe}kfc"
        assert: cand[1].text == "疯狂星期四V我50"
      # 加词时若第一候选已是固顶词，新词加到第二候选
      - send: "gc{Control+apostrophe}ljhev {Control+apostrophe}gc"
        assert: cand[1].text == "刚才" and cand[2].text == "垃圾回收"
      # 后移：Control+] 把已固定的候选往后移一位，与另一个已固定的候选交换位置
      - send: "jmdz{Control+semicolon}{Down}{Control+semicolon}{Up}"
        assert: cand[1].text == "见到" and cand[2].text == "剪刀"
      - send: "jmdz{Control+bracketright}jmdz"
        assert: cand[1].text == "剪刀" and cand[2].text == "见到"
      # 前移：Control+[
      - send: "jmdz{Down}{Control+bracketleft}jmdz"
        assert: cand[1].text == "见到" and cand[2].text == "剪刀"
      # 重置：Control+\ 取消当前编码上的所有自定义
      - send: "jmdz{Control+backslash}jmdz"
        assert: not pinned(1) and not pinned(2)
